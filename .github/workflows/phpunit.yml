name: PHPUnit

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer

      - name: Install Node dependencies
        run: npm ci

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      # wp-env 統合は CI 対象外。`phpunit:wp-env` は使わず 3a の unit-only のみ (Node は先に Setup 済み)。
      - name: Run PHPUnit (stage 3a — pure unit)
        run: npm run test:unit:php:unit-only
